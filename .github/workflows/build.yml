name: Build Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: windows-x86_64-cargo

      - name: install dependencies
        run: pnpm install

      - name: copy vendored assets
        run: pnpm --filter @openreadest/app setup-vendors

      - name: prepare env
        shell: bash
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/openreadest-app/.env.local

      - name: build Windows installer (NSIS)
        working-directory: apps/openreadest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenReadest-windows-x64-setup
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: linux-x86_64-cargo

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install dependencies
        run: pnpm install

      - name: copy vendored assets
        run: pnpm --filter @openreadest/app setup-vendors

      - name: prepare env
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/openreadest-app/.env.local

      - name: build Linux packages (AppImage + deb)
        working-directory: apps/openreadest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tauri build --bundles appimage,deb

      - name: upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenReadest-linux-x64
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: android-cargo

      - name: install dependencies
        run: pnpm install

      - name: copy vendored assets
        run: pnpm --filter @openreadest/app setup-vendors

      - name: prepare env
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/openreadest-app/.env.local

      - name: init Android project and signing config
        working-directory: apps/openreadest-app
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          rm -rf src-tauri/gen/android
          pnpm tauri android init

          pushd src-tauri/gen/android
          KEYSTORE="$RUNNER_TEMP/openreadest.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -storepass openreadest123 -keypass openreadest123 \
            -alias openreadest -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OpenReadest, OU=OpenReadest, O=OpenReadest, C=CN"
          echo "keyAlias=openreadest" > keystore.properties
          echo "password=openreadest123" >> keystore.properties
          echo "storeFile=$KEYSTORE" >> keystore.properties
          popd

      - name: build universal APK
        working-directory: apps/openreadest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          pnpm tauri android build --apk true

      - name: sign universal APK
        working-directory: apps/openreadest-app
        run: |
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk/universal/release
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/openreadest.keystore" \
            --ks-pass pass:openreadest123 \
            --key-pass pass:openreadest123 \
            --out "$APK_DIR/app-universal-release.apk" \
            "$APK_DIR/app-universal-release-unsigned.apk"
          ls -la "$APK_DIR"

      - name: upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenReadest-android-apk
          path: apps/openreadest-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error
