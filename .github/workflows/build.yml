name: Build Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v6

      - id: version
        run: echo "version=$(node -p "require('./apps/openreadest-app/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [ "$EVENT" = "push" ]; then
            # 该版本已发过且本次只是普通推送 → 跳过，不发版
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --title "OpenReadest $VERSION" --generate-notes
          fi

  build-windows:
    needs: release
    if: needs.release.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: windows-x86_64-cargo

      - name: install dependencies
        run: pnpm install

      - name: copy vendored assets
        run: pnpm --filter @openreadest/app setup-vendors

      - name: prepare env
        shell: bash
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/openreadest-app/.env.local

      - name: build Windows installer (NSIS)
        working-directory: apps/openreadest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenReadest-windows-x64-setup
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: attach Windows installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  build-linux:
    needs: release
    if: needs.release.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: linux-x86_64-cargo

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install dependencies
        run: pnpm install

      - name: copy vendored assets
        run: pnpm --filter @openreadest/app setup-vendors

      - name: prepare env
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/openreadest-app/.env.local

      - name: build Linux packages (AppImage + deb)
        working-directory: apps/openreadest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tauri build --bundles appimage,deb

      - name: upload Linux packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenReadest-linux-x64
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: attach Linux packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb

  build-android:
    needs: release
    if: needs.release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: android-cargo

      - name: install dependencies
        run: pnpm install

      - name: copy vendored assets
        run: pnpm --filter @openreadest/app setup-vendors

      - name: prepare env
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/openreadest-app/.env.local

      - name: init Android project and signing config
        working-directory: apps/openreadest-app
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          rm -rf src-tauri/gen/android
          pnpm tauri android init

          pushd src-tauri/gen/android
          KEYSTORE="$RUNNER_TEMP/openreadest.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -storepass openreadest123 -keypass openreadest123 \
            -alias openreadest -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OpenReadest, OU=OpenReadest, O=OpenReadest, C=CN"
          echo "keyAlias=openreadest" > keystore.properties
          echo "password=openreadest123" >> keystore.properties
          echo "storeFile=$KEYSTORE" >> keystore.properties
          popd

      - name: build universal APK
        working-directory: apps/openreadest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          pnpm tauri android build --apk true

      - name: sign universal APK
        working-directory: apps/openreadest-app
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk/universal/release
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/openreadest.keystore" \
            --ks-pass pass:openreadest123 \
            --key-pass pass:openreadest123 \
            --out "$APK_DIR/OpenReadest_${VERSION}_universal.apk" \
            "$APK_DIR/app-universal-release-unsigned.apk"
          ls -la "$APK_DIR"

      - name: upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenReadest-android-apk
          path: apps/openreadest-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/OpenReadest_*_universal.apk
          if-no-files-found: error

      - name: attach Android APK to release
        working-directory: apps/openreadest-app
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber src-tauri/gen/android/app/build/outputs/apk/universal/release/OpenReadest_*_universal.apk
